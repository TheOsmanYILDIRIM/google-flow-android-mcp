name: Build & Release Google Flow MCP APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect Output APK
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AndroidBrowserMCP-Release.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBrowserMCP-APK
          path: build-output/AndroidBrowserMCP-Release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.1
          name: "Universal Android Browser Bridge MCP v4.0.1 (Release)"
          body: |
            ### 🌐 Universal Android Browser Bridge MCP Server (v4.0.1)

            - **Google OAuth / Giriş Koruması:** Safari macOS ve Pixel Chrome temiz User-Agent profilleri ile WebView engelleri aşıldı.
            - **Tek APK Çıktısı:** AndroidBrowserMCP-Release.apk
            - **Ağ Trafiği Koklayıcı & DOM Motoru:** Tam teşekküllü WebView köprüsü.
          files: build-output/AndroidBrowserMCP-Release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
