name: Build & Release Google Flow MCP APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect Output APK
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/GoogleFlowMCP-Release.apk \;
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AndroidBrowserMCP-Release.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidBrowserMCP-APK
          path: build-output/AndroidBrowserMCP-Release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: "Universal Android Browser Bridge & Google Flow MCP v4.0.0 (Release)"
          body: |
            ### 🌐 Universal Android Browser Bridge & Google Flow MCP Server (v4.0.0)

            Deep network traffic sniffer, JavaScript execution engine, interactive DOM analyzer, and Google Flow visual automation running natively in Android background with 1x1 floating overlay.

            #### 🚀 Features:
            - **Universal Web Navigation:** Navigate, reload, back, forward on any site.
            - **Deep Network Sniffing:** Captures all `fetch` and `XMLHttpRequest` requests, payloads, HTTP statuses, and JSON responses.
            - **Interactive DOM Analyzer:** Extracts structured UI trees with click/type simulation.
            - **Console Logs & Errors:** Captures real-time browser console streams.
            - **Google Flow & NotebookLM Automation:** Full support for Imagen 3, Veo 3.1, Nano Banana, and research helpers.
          files: |
            build-output/AndroidBrowserMCP-Release.apk
            build-output/GoogleFlowMCP-Release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
